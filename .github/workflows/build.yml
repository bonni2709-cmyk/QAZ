name: build

# CI for RAILGUN PURSUIT 3D.
#   desktop-check : cargo check / test / clippy (advisory) on stable, plus a release build
#   android       : cross-compile check for the three Android ABIs Infinix Note 30 needs
#   apk           : MANUAL (workflow_dispatch) — builds a signed-debug APK via cargo-quad-apk
#
# No crates.io mirror is required on the runner; GitHub-hosted runners reach crates.io fine.

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# cancel superseded runs on the same ref (CI minute hygiene)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  desktop-check:
    name: desktop (check / test / release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache generated asset pack
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: asset-pack-${{ hashFiles('tools/gen_assets.py') }}

      - name: Generate asset pack (tools/gen_assets.py)
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy pillow
          python3 tools/gen_assets.py

      - name: Verify asset manifest (real bytes)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          entries = json.load(open('assets/manifest.json'))
          total = sum(e['bytes'] for e in entries)
          assert len(entries) >= 10, entries
          assert total > 40_000_000, f'asset pack suspiciously small: {total}'
          print(f'asset pack OK: {len(entries)} files, {total / 1e6:.1f} MB total')
          PY

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: System libraries (macroquad/miniquad linux deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev \
            libegl1-mesa-dev libxcursor-dev libxrandr-dev pkg-config

      - name: cargo fmt --check (advisory)
        run: cargo fmt --check
        continue-on-error: true

      - name: cargo clippy (advisory)
        run: cargo clippy --all-targets
        continue-on-error: true

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: railgun-pursuit-3d-linux-x86_64
          path: target/release/railgun-pursuit-3d
          if-no-files-found: error
          retention-days: 14

  android:
    name: android (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android      # Infinix Note 30 (arm64-v8a) — primary
          - armv7-linux-androideabi    # 32-bit ARM fallback
          - x86_64-linux-android       # emulator / ChromeOS
    steps:
      - uses: actions/checkout@v4

      - name: Cache generated asset pack
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: asset-pack-${{ hashFiles('tools/gen_assets.py') }}

      - name: Generate asset pack (tools/gen_assets.py)
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy pillow
          python3 tools/gen_assets.py

      - name: Verify asset manifest (real bytes)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          entries = json.load(open('assets/manifest.json'))
          total = sum(e['bytes'] for e in entries)
          assert len(entries) >= 10, entries
          assert total > 40_000_000, f'asset pack suspiciously small: {total}'
          print(f'asset pack OK: {len(entries)} files, {total / 1e6:.1f} MB total')
          PY

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Locate Android NDK (preinstalled on GitHub runners)
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "${NDK_HOME}" ]; then
            NDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/ndk"
            NDK_HOME="${NDK_ROOT}/$(ls "${NDK_ROOT}" | sort -V | tail -1)"
          fi
          echo "NDK_HOME=${NDK_HOME}"
          echo "home=${NDK_HOME}" >> "${GITHUB_OUTPUT}"

      - name: Configure NDK clang linker
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-linux-android)   CLANG=aarch64-linux-android26-clang ;;
            armv7-linux-androideabi) CLANG=armv7a-linux-androideabi26-clang ;;
            x86_64-linux-android)    CLANG=x86_64-linux-android26-clang ;;
            *) echo "unsupported target" >&2; exit 1 ;;
          esac
          LINKER="${{ steps.ndk.outputs.home }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${CLANG}"
          test -x "${LINKER}"
          ENV_NAME="CARGO_TARGET_$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')_LINKER"
          echo "${ENV_NAME}=${LINKER}" >> "${GITHUB_ENV}"
          echo "Using ${LINKER}"

      - name: cargo check --target ${{ matrix.target }}
        run: cargo check --release --target ${{ matrix.target }} --all-targets

      - name: cargo build --release --target ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload android artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: railgun-pursuit-3d-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/railgun-pursuit-3d*
          if-no-files-found: warn
          retention-days: 14

  apk:
    name: apk (manual, cargo-quad-apk)
    needs: [desktop-check, android]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'  # TEMP: push so the APK can be minted headlessly; restore workflow_dispatch-only afterwards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache generated asset pack
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: asset-pack-${{ hashFiles('tools/gen_assets.py') }}

      - name: Generate asset pack (tools/gen_assets.py)
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy pillow
          python3 tools/gen_assets.py

      - name: Verify asset manifest (real bytes)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          entries = json.load(open('assets/manifest.json'))
          total = sum(e['bytes'] for e in entries)
          assert len(entries) >= 10, entries
          assert total > 40_000_000, f'asset pack suspiciously small: {total}'
          print(f'asset pack OK: {len(entries)} files, {total / 1e6:.1f} MB total')
          PY

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: apk

      - name: Locate Android SDK & NDK (same discovery the cross-compile job uses)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_ROOT="${SDK_ROOT}/ndk"

          # Probe for the oldest NDK that ships llvm-ar; NDK r23+ renamed the
          # legacy target-prefixed binutils to llvm-* / plain, so do NOT trust
          # the preinstalled ANDROID_NDK_LATEST_HOME.
          NDK_HOME=""
          for CAND in $(ls "${NDK_ROOT}" | sort -V); do
            TB="${NDK_ROOT}/${CAND}/toolchains/llvm/prebuilt/linux-x86_64/bin"
            if [ -x "${TB}/llvm-ar" ]; then
              NDK_HOME="${NDK_ROOT}/${CAND}"
              echo "selected NDK ${CAND}"
              break
            fi
          done
          test -d "${NDK_HOME}"
          TOOLBIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # cargo-quad-apk (crates.io) looks for the pre-r23 legacy names
          # <triple>-ar / <triple>-ld; NDK r23+ renamed them to llvm-ar / ld.
          for TGT in arm-linux-androideabi aarch64-linux-android x86_64-linux-android i686-linux-android; do
            for PAIR in ar:llvm-ar ld:ld readelf:llvm-readelf objdump:llvm-objdump objcopy:llvm-objcopy nm:llvm-nm ranlib:llvm-ranlib strip:llvm-strip strings:llvm-strings; do
              WANT="${PAIR%%:*}"; HAVE="${PAIR##*:}"
              [ -e "${TOOLBIN}/${TGT}-${WANT}" ] || ln -sfn "${HAVE}" "${TOOLBIN}/${TGT}-${WANT}" || true
            done
          done

          # guarantee `-lunwind` resolves: hand rustc per-target search paths
          # pointing at the NDK clang resource dir that holds libunwind.a
          CLANG_LINUX_DIR="$(ls -d "${NDK_HOME}"/toolchains/llvm/prebuilt/linux-x86_64/lib*/clang/*/lib/linux 2>/dev/null | head -1 || true)"
          echo "CLANG_LINUX_DIR=${CLANG_LINUX_DIR}"
          if [ -n "${CLANG_LINUX_DIR}" ]; then
            for ARCH in aarch64 x86_64 arm i386; do
              D="${CLANG_LINUX_DIR}/${ARCH}"
              [ -f "${D}/libunwind.a" ] || continue
              case "${ARCH}" in
                aarch64) TR="AARCH64_LINUX_ANDROID" ;;
                x86_64)  TR="X86_64_LINUX_ANDROID" ;;
                arm)     TR="ARMV7_LINUX_ANDROIDEABI" ;;
                i386)    TR="I686_LINUX_ANDROID" ;;
              esac
              echo "CARGO_TARGET_${TR}_RUSTFLAGS=-L ${D}"
              printf 'CARGO_TARGET_%s_RUSTFLAGS=-L %s\n' "${TR}" "${D}" >> "$GITHUB_ENV"
            done
          fi

          echo "NDK_HOME=${NDK_HOME}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=${NDK_HOME}" >> "$GITHUB_ENV"

      - name: Ensure the android-29 platform exists (cargo-quad-apk requires exactly this jar)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for d in "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" "${ANDROID_SDK_ROOT}/cmdline-tools/bin" "${ANDROID_SDK_ROOT}/tools/bin"; do
            if [ -x "$d/sdkmanager" ]; then
              SDKMANAGER="$d/sdkmanager"
              break
            fi
          done
          if [ -z "${SDKMANAGER}" ]; then
            command -v sdkmanager >/dev/null && SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "sdkmanager: ${SDKMANAGER:-NOT FOUND}"
          if [ -n "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
            "${SDKMANAGER}" "platforms;android-29"
          else
            echo "::error::sdkmanager not found — cannot install platforms;android-29"
            exit 1
          fi
          test -f "${ANDROID_SDK_ROOT}/platforms/android-29/android.jar" && echo "android-29 OK"

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk --locked

      - name: Build debug APK (signed with default debug keystore)
        env:
          RUST_BACKTRACE: "1"
        run: |
          set +e
          cargo quad-apk build --release > /tmp/quad-apk.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "quad-apk exited $rc — emitting the diagnostic lines as annotations"
            grep -inE "error|failed|panic|missing|not found|denied|rejected|exception" /tmp/quad-apk.log | tail -n 22 | while IFS= read -r line; do
              printf '::error::%s\n' "${line}"
            done
            # always emit the last lines too, so context survives filter misses
            tail -n 6 /tmp/quad-apk.log | while IFS= read -r line; do
              printf '::error::TAIL %s\n' "${line}"
            done
            exit $rc
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: railgun-pursuit-3d-apk
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
          retention-days: 30
