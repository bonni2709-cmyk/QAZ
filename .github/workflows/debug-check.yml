name: debug-check
# Temporary diagnostics workflow: runs `cargo check` and re-emits compiler
# errors as `::error::` annotations (retrievable via the check-runs API,
# since raw step logs are not downloadable in this sandbox).
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

jobs:
  debug:
    name: debug cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: debug-check

      - name: System libraries (macroquad/miniquad linux deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev \
            libegl1-mesa-dev libxcursor-dev libxrandr-dev pkg-config

      - name: cargo check --all-targets, errors as annotations
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo check --all-targets > check.log 2>&1
          code=$?
          echo "cargo check exit code: $code"
          if [ $code -ne 0 ]; then
            # keep rustc error blocks: the error line + 5 lines of context + --> paths
            grep -E -A5 '^(error|warning: unused)' check.log | head -300 > selected.txt
            if [ ! -s selected.txt ]; then
              cp check.log selected.txt
            fi
            split -b 1200 -d selected.txt chunk_
            i=0
            for f in chunk_*; do
              i=$((i + 1))
              printf '::error::CHUNK %s %s\n' "$i" "$(base64 -w0 "$f")"
            done
            exit $code
          fi
